# LiveForge — twice-daily live-data refresh.
# Runs 15 minutes after each scheduled vocabulary post (07:15 / 17:15 UTC),
# so "latest lesson" and "last push" are never more than ~12 hours stale.
# The cache is committed only if the fetched data changed; that commit
# triggers a Cloudflare Pages rebuild. A failed fetch never overwrites a
# good cache. The build itself never fails because data failed — but the
# workflow FAILS loudly if the build fell back to the stale cache
# (dist/status.json dataStale: true), so a silent stale site is impossible.
# No token of any kind is used by this workflow.
name: Refresh live data

# Least privilege: this workflow only reads the repo and pushes the
# refreshed cache back. The default token must not stay permissive.
permissions:
  contents: write

on:
  schedule:
    - cron: "30 7 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch + build
        run: node scripts/build.mjs

      - name: Fail loudly if the build fell back to stale cache
        # A failed fetch used to pass silently (green run, no commit, no
        # rebuild) while the live site quietly went stale. The build writes
        # dist/status.json with dataStale: true on fallback — fail the run
        # so the staleness is visible in Actions instead of silent.
        run: |
          node -e "const s = JSON.parse(require('fs').readFileSync('dist/status.json', 'utf8')); if (s.dataStale) { console.error('STALE: build fell back to the committed cache (fetch failed); see the build log sources.'); process.exit(1); } console.log('Live data fresh (dataStale: false).')"

      - name: Commit cache only if changed
        run: |
          git config user.name "liveforge-build"
          git config user.email "liveforge-build@users.noreply.github.com"
          git add src/data/projects.cache.json assets/img/avatar.png
          git diff --cached --quiet || git commit -m "chore: refresh live data cache [skip ci]"
          git push || echo "Nothing to push or push skipped"
